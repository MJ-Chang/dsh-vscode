<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>

  <!-- ============ SETUP ============ -->
  <section id="setup" class="screen">
    <div class="setup-card">
      <div class="logo">DSH</div>
      <h1 class="setup-title">DeepSeek Harness</h1>
      <p class="setup-subtitle">A coding agent in your editor, powered by DeepSeek Harness.</p>
      <label class="field-label" for="key-input">API Key</label>
      <div id="setup-key-group">
        <input id="key-input" type="password" class="key-input" placeholder="sk-…" autocomplete="off" spellcheck="false" autofocus>
        <button id="connect-btn" class="connect-btn">Connect</button>
      </div>
      <p id="setup-error" class="setup-error" hidden></p>
      <p class="setup-hint">Stored in VS Code secret storage. Or set <code>DEEPSEEK_API_KEY</code> / workspace <code>.env</code>.</p>
    </div>
  </section>

  <!-- ============ CHAT ============ -->
  <section id="chat" class="screen" hidden>
    <header id="header">
      <div class="header-main">
        <span id="workspace" class="workspace" title="Workspace path (click to copy)"></span>
        <span id="status" class="status status-idle">idle</span>
      </div>
      <div class="header-sub">
        <button id="preset-btn" class="pill" title="Agent preset — which tools & capabilities this session runs">preset <span id="preset-name" class="pill-value">default</span></button>
        <button id="history-btn" class="pill" title="Conversation history">history ▾</button>
        <span class="spacer"></span>
        <button id="new-session-btn" class="icon-btn" title="New conversation">＋</button>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <!-- popup menus -->
    <div id="menu-layer" class="menu-layer" hidden>
      <div id="model-menu" class="menu" hidden></div>
      <div id="mode-menu" class="menu" hidden></div>
      <div id="history-menu" class="menu" hidden></div>
      <div id="preset-menu" class="menu" hidden></div>
      <div id="settings-menu" class="menu" hidden></div>
      <div id="workspace-menu" class="menu" hidden></div>
    </div>

    <footer id="composer">
      <div id="attachments" class="attachments" hidden></div>
      <textarea id="input" rows="2" placeholder="Ask to read, write, or change your project… (Enter to send)"
                aria-label="Message"></textarea>
      <div class="composer-bar">
        <button id="attach-btn" class="icon-btn" title="Attach files">📎</button>
        <button id="model-btn" class="select-btn" title="Model">
          <span class="select-btn-label">model</span>
          <span id="model-name" class="select-btn-value">…</span>
          <span class="select-btn-caret">▾</span>
        </button>
        <button id="mode-btn" class="pill mode-pill" title="Permission mode — click to change">
          <span id="mode-name">…</span><span class="select-btn-caret">▾</span>
        </button>
        <span id="usage" class="usage" title="Tokens used this conversation">0↑ · 0↓</span>
        <span class="spacer"></span>
        <button id="send-btn" class="send-btn" title="Send">Send</button>
      </div>
    </footer>
  </section>

  <script nonce="{{nonce}}" src="{{jsUri}}"></script>
</body>
</html>
