<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}};">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
  <header id="header">
    <div class="title-row">
      <span class="title">DeepSeek Harness</span>
      <span id="status" class="status status-idle">idle</span>
    </div>
    <div id="meta" class="meta">runtime starting…</div>
  </header>

  <main id="messages" class="messages" aria-live="polite"></main>

  <footer id="composer">
    <textarea id="input" rows="2" placeholder="Ask the agent to help with your code… (Enter to send, Shift+Enter for newline)"
              aria-label="Message"></textarea>
    <div class="actions">
      <button id="new-session" class="btn" title="Start a new conversation">New session</button>
      <button id="stop" class="btn btn-danger" title="Stop the current turn" disabled>Stop</button>
      <button id="send" class="btn btn-primary" title="Send">Send</button>
    </div>
  </footer>

  <script nonce="{{nonce}}" src="{{jsUri}}"></script>
</body>
</html>
