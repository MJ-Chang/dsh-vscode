name: Bug report
description: Report a bug in dsh-vscode
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can.
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: e.g. 1.98.0
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: dsh-vscode version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace folder
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Extension host output (Output panel → DeepSeek Harness) or the chat-view error message, if any. Redact API keys.
      render: text
